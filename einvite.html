<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mohankumar & Arthi — Wedding Invitation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
.invite{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
video{width:100%;height:100%;object-fit:contain;display:block}
.layer{position:absolute;inset:0;pointer-events:none;display:none}
.layer.show{display:block}
/* Name scene: only cover the original names; the heart, flowers and temple remain visible. */
.nameCover{position:absolute;background:rgba(250,244,214,.985);border:0}
.c1{left:19.5%;top:26.2%;width:61%;height:6.0%}
.c2{left:23.5%;top:39.4%;width:53%;height:7.0%}
.nameText{position:absolute;left:0;width:100%;text-align:center;color:#a82e3d;font-family:"Brush Script MT","Segoe Script",cursive;font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.groom{top:26.0%;font-size:clamp(30px,7vw,55px)}
.bride{top:39.0%;font-size:clamp(30px,7vw,55px)}
/* Date / venue scene */
.infoCover{position:absolute;left:17%;width:66%;background:rgba(250,244,214,.98);border:2px solid #b58b32;border-radius:28px}
.dateCover{top:31.5%;height:9.2%}
.venueCover{top:57.3%;height:10.2%}
.infoText{position:absolute;left:0;width:100%;text-align:center;color:#3d382d;font-family:Georgia,serif;font-weight:700}
.dateText{top:34.0%;font-size:clamp(24px,5vw,42px)}
.venueText{top:60.2%;font-size:clamp(23px,5vw,40px);color:#a82e3d}
@media (min-aspect-ratio:10/16){video{height:100%;width:auto}}
</style>
</head>
<body>
<div class="invite">
  <!-- Keep the original video untouched: same background, flowers, temple, animation and audio. -->
  <video id="bg" src="invite.mp4" autoplay muted playsinline></video>

  <div id="names" class="layer">
    <div class="nameCover c1"></div><div class="nameCover c2"></div>
    <div class="nameText groom">Mohankumar</div>
    <div class="nameText bride">Arthi</div>
  </div>

  <div id="details" class="layer">
    <div class="infoCover dateCover"></div>
    <div class="infoCover venueCover"></div>
    <div class="infoText dateText">November 22</div>
    <div class="infoText venueText">Mallapadi Mahal</div>
  </div>
</div>
<script>
const video=document.getElementById('bg');
const names=document.getElementById('names');
const details=document.getElementById('details');
function update(){
  const t=video.currentTime;
  // Based on the supplied 28.5s reference video.
  names.classList.toggle('show', t>=6.0 && t<14.0);
  details.classList.toggle('show', t>=20.0 && t<26.0);
  requestAnimationFrame(update);
}
video.addEventListener('loadedmetadata',()=>{video.play();update()});
</script>
</body>
</html>
