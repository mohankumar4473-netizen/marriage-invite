<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthi & Mohankumar | Wedding Invitation</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at top, #fff8df 0%, #f6dfb5 45%, #d7a55c 100%);
    color: #5b2418;
}

.invite {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* Background decoration */

.glow {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: rgba(255,255,255,.25);
    filter: blur(50px);
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
}

.flower {
    position: absolute;
    font-size: 35px;
    animation: float 5s ease-in-out infinite;
    opacity: .8;
}

.f1 { left: 7%; top: 10%; }
.f2 { right: 7%; top: 17%; animation-delay: 1s; }
.f3 { left: 12%; bottom: 15%; animation-delay: 2s; }
.f4 { right: 12%; bottom: 12%; animation-delay: 3s; }

@keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(8deg); }
}

/* Main card */

.card {
    position: absolute;
    width: min(92%, 430px);
    height: 92vh;
    max-height: 760px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid #b77b25;
    border-radius: 220px 220px 25px 25px;
    background: rgba(255,249,226,.92);
    box-shadow:
        0 25px 70px rgba(82,35,10,.3),
        inset 0 0 0 8px rgba(190,130,35,.08);
    text-align: center;
    padding: 45px 25px;
    animation: cardIn 1.8s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translate(-50%, -45%) scale(.85);
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

/* Top */

.om {
    font-size: 38px;
    color: #9b4b20;
    margin-bottom: 4px;
}

.inviteText {
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #a66a20;
}

.names {
    margin-top: 18px;
    font-size: clamp(32px, 9vw, 48px);
    color: #762817;
    font-weight: normal;
}

.amp {
    font-size: 22px;
    color: #c38a25;
    margin: 5px;
}

/* Couple */

.couple {
    height: 220px;
    position: relative;
    margin: 10px auto 0;
    width: 260px;
}

/* Bride */

.bride,
.groom {
    position: absolute;
    bottom: 0;
    width: 105px;
    height: 170px;
}

.bride {
    left: 20px;
}

.groom {
    right: 20px;
}

/* heads */

.head {
    position: absolute;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #9a5b39;
    top: 10px;
    left: 27px;
    z-index: 3;
}

.hair {
    position: absolute;
    width: 57px;
    height: 42px;
    background: #24140e;
    border-radius: 50% 50% 35% 35%;
    top: 3px;
    left: 24px;
    z-index: 4;
}

.bride .hair {
    height: 58px;
    border-radius: 50% 50% 30% 30%;
}

.jasmine {
    position: absolute;
    top: 18px;
    left: 8px;
    font-size: 18px;
    z-index: 5;
}

/* Bride saree */

.brideBody {
    position: absolute;
    width: 105px;
    height: 110px;
    bottom: 0;
    background: linear-gradient(
        135deg,
        #9b1830,
        #d82f42 55%,
        #b88a26 56%,
        #e1bd61 65%,
        #9b1830 66%
    );
    border-radius: 55px 55px 15px 15px;
    clip-path: polygon(25% 0,75% 0,100% 100%,0 100%);
}

.necklace {
    position: absolute;
    top: 58px;
    left: 43px;
    color: #e6bd54;
    font-size: 24px;
    z-index: 6;
}

/* Groom */

.groom .head {
    background: #895034;
}

.groom .hair {
    height: 25px;
    border-radius: 50% 50% 15% 15%;
}

.groomBody {
    position: absolute;
    width: 100px;
    height: 115px;
    bottom: 0;
    background: #f4eee0;
    border-radius: 45px 45px 10px 10px;
}

.vesti {
    position: absolute;
    width: 110px;
    height: 48px;
    bottom: 0;
    left: -5px;
    background: linear-gradient(#fffdf5 0 70%, #c19a45 71% 82%, #fffdf5 83%);
}

.angavastram {
    position: absolute;
    width: 28px;
    height: 95px;
    background: #d6b458;
    transform: rotate(-20deg);
    left: 12px;
    top: 8px;
}

/* Date */

.date {
    margin-top: 8px;
    font-size: 18px;
    letter-spacing: 2px;
    color: #8b3b1f;
}

.time {
    margin-top: 7px;
    font-size: 14px;
    letter-spacing: 1px;
}

.divider {
    width: 100px;
    height: 1px;
    background: #bd8a38;
    margin: 17px auto;
}

.venue {
    font-size: 18px;
    font-weight: bold;
    color: #762817;
}

.location {
    margin-top: 5px;
    font-size: 14px;
}

/* Bottom */

.footer {
    margin-top: 17px;
    font-size: 13px;
    font-style: italic;
    color: #96601e;
}

/* Decorative lamps */

.lamp {
    position: absolute;
    bottom: 25px;
    font-size: 34px;
    animation: flame 1s infinite alternate;
}

.lamp.left { left: 20px; }
.lamp.right { right: 20px; }

@keyframes flame {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
}

/* Button */

.musicBtn {
    position: absolute;
    right: 18px;
    top: 18px;
    border: 1px solid #b77b25;
    background: rgba(255,250,230,.8);
    border-radius: 50%;
    width: 42px;
    height: 42px;
    cursor: pointer;
    font-size: 18px;
}

/* Mobile */

@media (max-height: 680px) {
    .card {
        padding-top: 25px;
        height: 94vh;
    }

    .couple {
        height: 165px;
        transform: scale(.78);
        margin: -10px auto;
    }

    .names {
        font-size: 32px;
    }

    .footer {
        margin-top: 10px;
    }
}
</style>
</head>

<body>

<div class="invite">

    <div class="glow"></div>

    <div class="flower f1">🌸</div>
    <div class="flower f2">🌺</div>
    <div class="flower f3">🌼</div>
    <div class="flower f4">🌸</div>

    <button class="musicBtn" onclick="toggleMusic()">♪</button>

    <div class="card">

        <div class="om">ॐ</div>

        <div class="inviteText">
            With the blessings of our families
        </div>

        <div class="names">
            Arthi
            <div class="amp">&</div>
            Mohankumar
        </div>

        <!-- South Indian Couple -->
        <div class="couple">

            <div class="bride">

                <div class="hair"></div>
                <div class="head"></div>

                <div class="jasmine">🌼🌼</div>

                <div class="necklace">◈</div>

                <div class="brideBody"></div>

            </div>

            <div class="groom">

                <div class="hair"></div>
                <div class="head"></div>

                <div class="groomBody"></div>
                <div class="angavastram"></div>
                <div class="vesti"></div>

            </div>

        </div>

        <div class="date">
            22 · NOVEMBER · 2026
        </div>

        <div class="time">
            7:30 AM — 9:30 AM
        </div>

        <div class="divider"></div>

        <div class="venue">
            Shri Harishwar Mahal
        </div>

        <div class="location">
            Mallapadi
        </div>

        <div class="footer">
            Together with our families,<br>
            we invite you to celebrate our special day.
        </div>

    </div>

    <div class="lamp left">🪔</div>
    <div class="lamp right">🪔</div>

</div>

<script>
function toggleMusic() {
    alert("Add your wedding music file and connect it to this button.");
}
</script>

</body>
</html>
